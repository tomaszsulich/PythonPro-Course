{% load static %}

<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Search</title>
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
</head>

<body>

    <h1>Search</h1>

    <form method="GET" action="">
        <input type="text" name="q" placeholder="Szukaj..." value="{{ request.GET.q }}" />

        <button type="submit">Szukaj</button>
    </form>

    {% if request.GET.q %}
    <h3>Wyniki dla: "{{ request.GET.q }}"</h3>
    {% for post in posts %}
    <article>
        <h3>{{ post.title }} [{{ post.category.name }}]</h3>
        <p>{{ post.author.name }}</p>
    </article>
    {% endfor %}
    {% endif %}

</body>

</html>
