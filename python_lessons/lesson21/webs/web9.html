<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Grid</title>
  <style>
    #dashboard {
      display: grid;
      grid-template-columns: 250px 1fr;
      grid-template-rows: 60px 1fr;
      gap: 10px;
      height: 100vh;
    }

    header {
      grid-column: 1 / 3;
      background: #333;
      color: white;
      padding: 15px;
    }

    nav {
      background: #f0f0f0;
      padding: 10px;
    }

    main {
      background: #e0e0e0;
      padding: 10px;
    }
  </style>
  <script>
    
  </script>
</head>

<body>

    <div class="dashboard">
    <header>Header</header>
    <nav>Menu</nav>
    <main>Main content</main>
    </div>

</body>

</html>
