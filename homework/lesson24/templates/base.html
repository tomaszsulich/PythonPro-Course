<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>
        {% block title %}
        Lesson 24
        {% endblock %}
    </title>
</head>
<body>

<nav>
    <a href="{% url 'home' %}">Strona główna</a>

    {% if user.is_authenticated %}
        <a href="{% url 'profile' %}">Profil</a>

        {% if user.is_staff %}
            <a href="{% url 'user_list' %}">
                Lista użytkowników
            </a>
        {% endif %}

        <form
            method="post"
            action="{% url 'logout' %}"
            style="display: inline;"
        >
            {% csrf_token %}
            <button type="submit">Wyloguj</button>
        </form>
    {% else %}
        <a href="{% url 'login' %}">Zaloguj</a>
        <a href="{% url 'register' %}">Zarejestruj</a>
    {% endif %}
</nav>

<hr>

{% if messages %}
    {% for message in messages %}
        <div>
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

{% block content %}
{% endblock %}

</body>
</html>
