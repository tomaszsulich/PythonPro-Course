<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{{ category.name }}</title>
</head>
<body>

<h1>{{ category.name }}</h1>

<ul>
    {% for article in category.article_set.all %}
        <li>{{ article.title }}</li>
    {% empty %}
        <li>Brak artykułów w tej kategorii.</li>
    {% endfor %}
</ul>

</body>
</html>
